[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-optimization-lab"
version = "0.1.0"
description = "Offline prompt optimization with multi-objective evaluation and reproducible search"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_lab"]
